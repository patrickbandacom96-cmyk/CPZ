<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admin - Creative Plug Zambia</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1b1f2a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="adm">
  <section id="login" class="login">
    <img class="hero-logo" src="icons/logo.png" alt="Creative Plug Zambia logo">
    <h2>Admin login</h2>
    <p class="warn"><strong>Version 1 test login.</strong> The login below runs in the browser, so it is NOT secure. A real admin needs secure authentication and server-side authorization.</p>
    <label for="lUser">Username</label>
    <input id="lUser" type="text" autocomplete="username">
    <label for="lPass">Password</label>
    <input id="lPass" type="password" autocomplete="current-password">
    <p class="err" id="lErr"></p>
    <button class="btn primary" id="lBtn" type="button">Login</button>
  </section>

  <div id="shell" hidden>
    <header class="adm-bar">
      <button id="menuBtn" type="button" aria-label="Menu">Menu</button>
      <img src="icons/favicon-32.png" alt="" width="28" height="28">
      <strong>CPZ Admin</strong>
      <a href="#notifications" class="bell">Alerts <span id="bellN" class="dot" hidden>0</span></a>
    </header>
    <nav id="drawer" class="drawer">
      <a href="#dashboard">Dashboard</a><a href="#orders">Orders</a><a href="#customers">Customers</a>
      <a href="#sales">Sales</a><a href="#invoices">Invoices</a><a href="#receipts">Receipts</a>
      <a href="#services">Services</a><a href="#notifications">Notifications</a><a href="#settings">Settings</a>
      <a href="index.html">Customer app</a><a href="#logout" id="logout">Logout</a>
    </nav>
    <main id="main"></main>
  </div>

  <div id="doc" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="db.js"></script>
  <script src="admin.js"></script>
</body>
</html>
